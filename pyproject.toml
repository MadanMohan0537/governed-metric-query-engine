[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metricpact"
version = "0.2.0"
description = "Governed natural-language analytics with grain and calendar safety"
requires-python = ">=3.11"

[project.scripts]
metricpact = "metricpact.cli:main"

[tool.setuptools.packages.find]
include = ["metricpact*"]
